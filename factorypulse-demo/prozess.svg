<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc"><title id="title">FactoryPulse – vom Messwert zur freigegebenen Wartung</title><desc id="desc">Herstellerdaten werden am Edge vereinheitlicht, per MQTT übertragen, auf Qualität geprüft und gespeichert. Analytik und Herstellerwissen führen zu einem erklärten Befund. Menschen entscheiden über Prüfung und Wartung. Wartungsrückmeldungen verbessern nach Freigabe Modelle und Wissen.</desc><defs><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#dfedf7}.eyebrow{font-family:Consolas,monospace;fill:#8bc3c8;font-size:11px;letter-spacing:2px}.title{font-size:32px;font-weight:650}.h{font-size:17px;font-weight:600}.p{font-size:12px;fill:#a4bdcf}.node{fill:#132638;stroke:#34556e;stroke-width:1.5}.human{fill:#153b32;stroke:#4fa48b;stroke-width:1.5}.uncertain{fill:#302540;stroke:#7e639e;stroke-width:1.5}.line{fill:none;stroke:#62d8c0;stroke-width:2;marker-end:url(#arr)}.dash{stroke-dasharray:7 6}.label{font-size:11px;fill:#8cdbc8}</style><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#62d8c0" stroke-width="1.5"/></marker></defs><rect width="1280" height="820" rx="14" fill="#09121e"/><text x="46" y="51" class="eyebrow">FACTORYPULSE / INDUSTRIAL INTELLIGENCE / KI CONSULTANT</text><text x="46" y="101" class="title">Daten sammeln. Veränderungen verstehen. Menschen entscheiden.</text><text x="46" y="131" class="p">Referenzprozess für KMU · Herstellerübergreifende Zustandsüberwachung und Wartungsplanung</text>
<rect x="45" y="183" width="250" height="115" rx="9" class="node"/><text x="64" y="215" class="eyebrow">01 / QUELLEN</text><text x="64" y="246" class="h">Maschinen &amp; Software</text><text x="64" y="270" class="p">CAN / Modbus / OPC UA / IoT</text><path d="M295 240H350" class="line"/>
