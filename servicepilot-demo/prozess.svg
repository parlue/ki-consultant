<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1030" role="img" aria-labelledby="title desc">
<title id="title">ServicePilot – KI bereitet vor, Menschen entscheiden</title><desc id="desc">Kundenanfrage, Qualifizierung, menschliche Bestätigung, Wissensrecherche, belegter Entwurf und menschliche Freigabe. Fehlende Angaben führen zu Rückfragen, fehlendes Wissen zu verfügbarkeitsbasiertem Fachrouting oder Warteschlange. Kundenfeedback fließt nach Prüfung in Prozess und Wissen zurück.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#548c81" stroke-width="1.6"/></marker><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#193139}.heading{font-size:31px;font-weight:650}.sub{font-size:14px;fill:#60777c}.lane{font-size:12px;letter-spacing:1.7px;font-weight:700;fill:#50736b}.node{fill:white;stroke:#d5e2dd;stroke-width:1.5}.human{fill:#e6f3eb;stroke:#6ba68e;stroke-width:1.5}.stop{fill:#fff3df;stroke:#d5aa6f;stroke-width:1.5}.h{font-size:17px;font-weight:650}.body{font-size:12px;fill:#5c7378}.label{font-size:11px;fill:#327867}.line{fill:none;stroke:#548c81;stroke-width:1.7;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}</style></defs>
<rect width="1280" height="1030" fill="#f5f8f6" rx="16"/><text x="48" y="54" class="lane">KI CONSULTANT / KMU / REFERENZPROZESS</text><text x="48" y="101" class="heading">ServicePilot · Jede Entscheidung hat einen Menschen.</text><text x="48" y="130" class="sub">Kontrollierter Ablauf vom Eingang bis zur geprüften Verbesserung. Fiktives Prozessmodell.</text>
<rect x="35" y="170" width="390" height="775" rx="12" fill="#edf2f1"/><rect x="445" y="170" width="390" height="775" rx="12" fill="#e9f3ec"/><rect x="855" y="170" width="390" height="775" rx="12" fill="#f2eee6"/>
<text x="58" y="205" class="lane">KI / SYSTEM / WISSEN</text><text x="468" y="205" class="lane">SERVICEKRAFT / KUNDE</text><text x="878" y="205" class="lane">FACHTEAM / SERVICELEITUNG</text>
<rect x="70" y="240" width="320" height="83" rx="9" class="node"/><text x="90" y="270" class="h">01 · Eingang erfassen</text><text x="90" y="293" class="body">Ticket, Anliegen und notwendige Daten</text>
<path d="M230 323V351" class="line"/><rect x="70" y="355" width="320" height="90" rx="9" class="node"/><text x="90" y="385" class="h">02 · Qualifizieren</text><text x="90" y="409" class="body">Thema, Dringlichkeit, fehlende Angaben</text><text x="90" y="429" class="body">Kritische Vorgänge regelbasiert markieren</text>
<path d="M390 396H475" class="line"/><rect x="480" y="355" width="320" height="90" rx="9" class="human"/><text x="500" y="385" class="h">03 · Gate 1: Einordnung prüfen</text><text x="500" y="409" class="body">Bestätigen, korrigieren oder eskalieren</text><text x="500" y="429" class="body">Mensch wählt den Bearbeitungsweg</text>
<path d="M640 355V310" class="line"/><rect x="480" y="240" width="320" height="70" rx="9" class="human"/><text x="500" y="269" class="h">Angaben fehlen → Rückfrage</text><text x="500" y="291" class="body">Mensch prüft und gibt Rückfrage frei</text><path d="M480 274H395" class="line dash"/><text x="401" y="255" class="label">↺ neue Angaben</text>
<path d="M640 445V475H230V502" class="line"/><text x="435" y="467" class="label">Vollständig / unkritisch</text>
<rect x="70" y="507" width="320" height="95" rx="9" class="node"/><text x="90" y="538" class="h">04 · Freigegebenes Wissen suchen</text><text x="90" y="562" class="body">FAQ / Handbuch / Version / Zugriffsrecht</text><text x="90" y="583" class="body">Reicht der gültige Beleg für diesen Fall?</text>
<path d="M230 602V646" class="line"/><text x="243" y="628" class="label">Ja</text><rect x="70" y="651" width="320" height="86" rx="9" class="node"/><text x="90" y="681" class="h">05 · Belegten Entwurf erstellen</text><text x="90" y="705" class="body">KI formuliert; keine automatische Freigabe</text><text x="90" y="725" class="body">Fehler bleiben trotz Quellen möglich</text>
<path d="M390 693H475" class="line"/><rect x="480" y="651" width="320" height="86" rx="9" class="human"/><text x="500" y="681" class="h">06 · Gate 2: Antwort freigeben</text><text x="500" y="705" class="body">Fachlichkeit, Quellen und Zusagen prüfen</text><text x="500" y="725" class="body">Ändern, ablehnen oder Verantwortung tragen</text>
<path d="M800 397H885" class="line"/><text x="808" y="380" class="label">Kritisch</text>
<rect x="890" y="355" width="320" height="115" rx="9" class="stop"/><text x="910" y="386" class="h">Fachrouting / Eskalation</text><text x="910" y="411" class="body">Kein Beleg, Konflikt, kritischer Fall</text><text x="910" y="432" class="body">oder Lösungsversuch erfolglos</text><text x="910" y="453" class="body">Fachgebiet + frische Präsenz + Kapazität</text>
<path d="M390 553H840V447H885" class="line"/><text x="485" y="543" class="label">Nein / widersprüchlich → keine fachliche Antwort</text>
<path d="M1050 470V506" class="line"/><rect x="890" y="511" width="320" height="94" rx="9" class="human"/><text x="910" y="541" class="h">Zuweisung menschlich bestätigen</text><text x="910" y="565" class="body">Verfügbar: Kapazität reservieren</text><text x="910" y="586" class="body">Nicht verfügbar: Queue + Frist + Eskalation</text>
<path d="M1050 605V645" class="line"/><rect x="890" y="651" width="320" height="86" rx="9" class="human"/><text x="910" y="681" class="h">Fachkraft klärt den Fall</text><text x="910" y="705" class="body">Lösung dokumentieren, Antwort prüfen</text><text x="910" y="725" class="body">Neue Erkenntnisse zurück in den Entwurf</text><path d="M890 694H805" class="line"/>
<path d="M640 737V787" class="line"/><rect x="480" y="792" width="320" height="99" rx="9" class="human"/><text x="500" y="821" class="h">07 · Antwort &amp; Kundenfeedback</text><text x="500" y="845" class="body">Freigegebene Antwort, Lösung bestätigen</text><text x="500" y="867" class="body">Kunde bewertet; ungelöst → Fachrouting</text>
<path d="M800 841H1050V742" class="line dash"/><text x="841" y="831" class="label">Problem besteht weiter</text>
<path d="M480 841H395" class="line"/><rect x="70" y="792" width="320" height="99" rx="9" class="node"/><text x="90" y="821" class="h">08 · Verbesserung prüfen</text><text x="90" y="845" class="body">Serviceleitung / Wissensverantwortlicher</text><text x="90" y="867" class="body">Testen → versioniert freigeben</text><path d="M70 839H52V554H65" class="line dash"/>
<text x="48" y="986" class="sub">Prinzip: Keine automatische Wissensänderung. Kein Versand ohne Freigabe. Manueller Bearbeitungsweg bleibt verfügbar.</text>
</svg>
