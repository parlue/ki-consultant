name: KI-Briefing prüfen
on:
  pull_request:
    paths: ['ki-news/**', 'scripts/**', 'tests/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: node --check ki-news/news.js
      - run: node tests/frontend.cjs
